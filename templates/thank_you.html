<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In! - ResellSquare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            /* Exact gradient from your Empire Builder Hub */
            background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="glass-card max-w-md w-full p-10 text-center">
        <div class="mb-6 flex justify-center">
            <div class="h-20 w-20 bg-green-100 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-check text-4xl text-green-500"></i>
            </div>
        </div>

        <h1 class="text-3xl font-extrabold text-slate-900 mb-4">You're on the list!</h1>
        
        <p class="text-slate-600 text-lg mb-8 leading-relaxed">
            Thanks for joining the <span class="font-bold text-blue-600">Amazon FBA</span> waitlist. We'll email you as soon as your spot opens up.
        </p>

        <div class="space-y-4">
            <a href="/" class="block w-full py-4 bg-slate-900 text-white font-bold rounded-xl shadow-lg hover:bg-slate-800 hover:shadow-xl transition-all transform hover:-translate-y-1">
                Analyze Another Item
            </a>
        </div>
    </div>

</body>
</html>
