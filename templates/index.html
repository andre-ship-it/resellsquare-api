<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ResellSquare | Decision Intelligence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; color: white; }
        .app-container { background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%); min-height: 100vh; background-attachment: fixed; }
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .inner-subcard { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-green { background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4); }
        .price-chip.active { background: #3B82F6; color: white; border-color: #60A5FA; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        /* Fix for text wrapping in subcards */
        .inner-subcard p, #compsList div p {
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tabular { font-variant-numeric: tabular-nums; }
        
        /* Scanner & Shutter Styles */
        #reader { width: 100% !important; border-radius: 1.5rem; overflow: hidden; background: #000; }
        .scanner-overlay { border: 2px solid rgba(255,255,255,0.1); border-radius: 2rem; position: relative; }
        .shutter-btn { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: white; border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.3); z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .shutter-btn:active { scale: 0.9; background: #e2e8f0; }
    </style>
</head>
<body class="antialiased">

    <div class="app-container pb-12">
        <nav class="glass-nav sticky top-0 z-50 px-6 py-4 text-white">
            <div class="max-w-xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-green-500 w-8 h-8 rounded-lg flex items-center justify-center font-black shadow-lg text-white">R</div>
                    <span class="text-xl font-black tracking-tight">ResellSquare</span>
                </div>
                <span class="text-[10px] font-black opacity-40 uppercase tracking-[0.3em]">Decision Engine v2.1</span>
            </div>
        </nav>

        <main class="max-w-xl mx-auto px-4 py-8">
            
            <div class="glass-card rounded-[2.5rem] p-8 mb-6 fade-up">
                <form id="searchForm" class="space-y-6">
                    <div class="relative">
                        <label class="block text-[10px] font-black text-blue-200 uppercase tracking-widest mb-3 ml-1">Product Discovery</label>
                        <input type="text" id="query" class="w-full pl-6 pr-14 py-5 bg-slate-900/60 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-blue-400 transition-all text-lg font-medium" placeholder="Scan or type item name..." required>
                        <button type="button" id="scanBtn" class="absolute right-3 top-9 p-3 text-slate-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-barcode text-2xl"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="inner-subcard rounded-2xl p-4">
                            <p class="text-[9px] font-black text-blue-200 uppercase mb-2 tracking-widest">Buy Price</p>
                            <input type="number" step="0.01" id="cost_price" class="bg-transparent w-full text-xl font-bold outline-none text-white tabular" placeholder="0.00">
                        </div>
                        <div class="inner-subcard rounded-2xl p-4">
                            <p class="text-[9px] font-black text-blue-200 uppercase mb-2 tracking-widest">Shipping</p>
                            <input type="number" step="0.01" id="shipping_cost" class="bg-transparent w-full text-xl font-bold outline-none text-white tabular" value="0.00">
                        </div>
                    </div>

                    <button type="submit" id="analyzeBtn" class="w-full py-5 btn-green text-white font-black text-lg rounded-2xl transition-all active:scale-[0.98] uppercase tracking-wider">
                        What should I do?
                    </button>
                </form>
            </div>

            <div id="resultsArea" class="hidden space-y-6 fade-up">
                <div class="bg-white rounded-[3rem] p-10 text-center shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2" id="verdictTopBar"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Market Consensus</p>
                    <h1 id="verdictTitle" class="text-6xl font-black text-slate-900 mb-8 tracking-tighter italic">--</h1>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-black uppercase mb-1">Target Price</p>
                            <p id="displayPrice" class="text-4xl font-black text-slate-900 tabular">$0.00</p>
                        </div>
                        <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-black uppercase mb-1">Best Platform</p>
                            <p id="bestPlatform" class="text-xl font-black text-blue-600">--</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card rounded-[2rem] p-6 flex flex-col justify-between">
                        <div>
                            <p class="text-[9px] font-black text-blue-200 uppercase tracking-widest mb-4">Demand Velocity</p>
                            <p id="saleTime" class="text-xl font-bold text-white mb-2">--</p>
                            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                                <div id="velocityBar" class="h-full bg-blue-500" style="width: 0%; transition: width 1.5s ease;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="glass-card rounded-[2rem] p-6">
                        <p class="text-[9px] font-black text-blue-200 uppercase tracking-widest mb-4">Est. Net Profit</p>
                        <p id="netProfit" class="text-3xl font-black text-green-400 mb-1 tabular">$0.00</p>
                        <p id="roiText" class="text-[10px] font-bold text-blue-100/40">0% ROI</p>
                    </div>
                </div>

                <div class="glass-card rounded-[2rem] p-6">
                    <p class="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-4">Strategic Pricing</p>
                    <div class="flex p-1 bg-slate-900/60 rounded-2xl border border-white/5">
                        <button onclick="updatePrice('fast')" id="btn-fast" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">Fast</button>
                        <button onclick="updatePrice('balanced')" id="btn-balanced" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all active">Balanced</button>
                        <button onclick="updatePrice('max')" id="btn-max" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">Max</button>
                    </div>
                </div>

                <div class="glass-card rounded-[2rem] p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="text-[10px] font-black text-blue-200 uppercase tracking-widest">Evidence Feed</h4>
                        <span class="text-[9px] bg-white/10 px-2 py-1 rounded text-blue-100/40 font-bold uppercase">Live Sold</span>
                    </div>
                    <div id="compsList" class="space-y-3"></div>
                </div>
            </div>

            <div id="scannerModal" class="hidden fixed inset-0 bg-slate-900/95 z-[70] flex flex-col items-center justify-center p-6">
                <div class="w-full max-w-md space-y-6">
                    <div class="flex justify-between items-center text-white">
                        <h3 class="text-sm font-black uppercase tracking-widest">Vision Assistant</h3>
                        <button id="closeScanner" class="text-4xl font-light">&times;</button>
                    </div>
                    <div class="scanner-overlay overflow-hidden shadow-2xl relative">
                        <div id="reader"></div>
                        <button id="shutterBtn" class="hidden shutter-btn"></button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="barcodeMode" class="py-4 bg-blue-600 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-blue-400 transition-all">Barcode</button>
                        <button id="imageMode" class="py-4 bg-white/5 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-white/10 transition-all">Photo Search</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let currentPrices = {};
        let html5QrCode;
        let isPhotoMode = false;

        function updatePrice(tier) {
            document.getElementById('displayPrice').innerText = `$${currentPrices[tier].toFixed(2)}`;
            document.querySelectorAll('.price-chip').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tier}`).classList.add('active');
        }

        // Scanner Controls
        document.getElementById('scanBtn').onclick = async () => {
            document.getElementById('scannerModal').classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            startBarcodeMode();
        };

        function startBarcodeMode() {
            isPhotoMode = false;
            document.getElementById('shutterBtn').classList.add('hidden');
            document.getElementById('barcodeMode').classList.replace('bg-white/5', 'bg-blue-600');
            document.getElementById('imageMode').classList.replace('bg-blue-600', 'bg-white/5');
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: { width: 250, height: 150 } }, 
                (text) => {
                    document.getElementById('query').value = text;
                    stopScanner();
                    document.getElementById('analyzeBtn').click();
                }
            ).catch(err => console.error(err));
        }

        document.getElementById('imageMode').onclick = () => {
            isPhotoMode = true;
            document.getElementById('shutterBtn').classList.remove('hidden');
            document.getElementById('imageMode').classList.replace('bg-white/5', 'bg-blue-600');
            document.getElementById('barcodeMode').classList.replace('bg-blue-600', 'bg-white/5');
            // We keep the camera running but html5-qrcode's callback won't be used for barcodes
        };

        document.getElementById('barcodeMode').onclick = () => startBarcodeMode();

        document.getElementById('shutterBtn').onclick = async () => {
            const btn = document.getElementById('shutterBtn');
            btn.style.background = "#EF4444"; // Red flash
            
            try {
                const video = document.querySelector('#reader video');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const base64Image = canvas.toDataURL('image/jpeg', 0.8);

                const response = await fetch('/api/identify-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });
                
                const result = await response.json();
                if (result.success) {
                    document.getElementById('query').value = result.identified_product;
                    stopScanner();
                    document.getElementById('analyzeBtn').click();
                } else {
                    alert("Identification failed. Try a closer shot.");
                }
            } catch (err) {
                alert("Vision Error.");
            } finally {
                btn.style.background = "white";
            }
        };

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
            document.getElementById('scannerModal').classList.add('hidden');
        }
        document.getElementById('closeScanner').onclick = stopScanner;

        // Form Submission
        document.getElementById('searchForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('analyzeBtn');
            btn.innerText = "Analyzing...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: document.getElementById('query').value,
                        cost_price: document.getElementById('cost_price').value,
                        shipping_cost: document.getElementById('shipping_cost').value
                    })
                });
                
                const data = await response.json();
                currentPrices = data.pricing_tiers;

                document.getElementById('resultsArea').classList.remove('hidden');
                document.getElementById('verdictTitle').innerText = data.verdict;
                document.getElementById('verdictTitle').style.color = data.color_code;
                document.getElementById('verdictTopBar').style.backgroundColor = data.color_code;
                document.getElementById('bestPlatform').innerText = data.best_platform;
                document.getElementById('saleTime').innerText = data.time_to_sell;
                document.getElementById('netProfit').innerText = `$${data.financials.profit.toFixed(2)}`;
                document.getElementById('roiText').innerText = `${data.financials.roi}% ROI`;
                
                const vMap = { "1–2 weeks": 95, "2–4 weeks": 65, "4–8 weeks": 35 };
                document.getElementById('velocityBar').style.width = (vMap[data.time_to_sell] || 15) + "%";

                const list = document.getElementById('compsList');
                list.innerHTML = '';
                data.recent_sales.forEach(sale => {
                    const div = document.createElement('div');
                    div.className = "inner-subcard rounded-2xl p-4 flex items-center justify-between border border-white/5";
                    div.innerHTML = `<div class="flex items-center gap-4"><div class="w-10 h-10 bg-slate-800 rounded-lg overflow-hidden border border-white/5">${sale.image ? `<img src="${sale.image}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-image text-slate-700"></i>'}</div><div><p class="text-[11px] font-bold text-white">${sale.title}</p><p class="text-[9px] text-slate-500">${sale.date}</p></div></div><div class="text-right"><p class="text-sm font-black text-green-400 tabular">$${sale.price.toFixed(2)}</p><p class="text-[8px] font-black text-slate-500 uppercase">Sold</p></div>`;
                    list.appendChild(div);
                });

                updatePrice('balanced');
                document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
            } catch (err) { alert("Search failed."); }
            finally { btn.innerText = "What should I do?"; btn.disabled = false; }
        };
    </script>
</body>
</html>
