<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ResellSquare | Your Selling Assistant</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .verdict-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .price-btn.active { background: #3B82F6; border-color: #60A5FA; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        #reader { width: 100% !important; max-width: 400px; height: 300px; border-radius: 1.5rem; overflow: hidden; margin: 0 auto; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-50 antialiased">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-green-500 w-8 h-8 rounded-lg flex items-center justify-center font-black text-white">R</div>
                <span class="text-xl font-bold tracking-tight">ResellSquare</span>
            </div>
            <button onclick="location.reload()" class="text-xs font-bold text-slate-400 hover:text-white uppercase tracking-wider">New Scan</button>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-4 py-8">
        
        <div id="searchSection" class="glass-panel rounded-3xl p-6 mb-8 shadow-2xl">
            <form id="searchForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">What are you selling?</label>
                    <div class="relative flex items-center">
                        <input type="text" id="query" class="block w-full pl-4 pr-14 py-4 bg-slate-900/50 border border-slate-700 rounded-2xl text-white outline-none focus:ring-2 focus:ring-purple-500 transition-all" placeholder="Product name or barcode..." required>
                        <button type="button" id="scanBtn" class="absolute right-2 p-3 text-slate-400 hover:text-white bg-slate-800 rounded-xl border border-slate-700">
                            <i class="fa-solid fa-barcode text-xl"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Item Cost (Optional)</label>
                        <input type="number" step="0.01" id="cost_price" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-purple-500" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Shipping Cost</label>
                        <input type="number" step="0.01" id="shipping_cost" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-purple-500" value="0">
                    </div>
                </div>

                <button type="submit" id="analyzeBtn" class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black text-lg rounded-2xl shadow-lg hover:shadow-green-500/40 transition-all active:scale-[0.98]">
                    WHAT SHOULD I DO?
                </button>
            </form>
        </div>

        <div id="loading" class="hidden text-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-700 border-t-white mx-auto"></div>
            <p class="mt-4 font-bold text-blue-100/60 uppercase tracking-widest text-xs">Analyzing Market Demand...</p>
        </div>

        <div id="resultsArea" class="hidden space-y-6 fade-in">
            
            <div id="verdictCard" class="bg-white text-slate-900 rounded-[2.5rem] shadow-2xl p-10 text-center verdict-card">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Recommended Action</p>
                <h1 id="verdictTitle" class="text-5xl font-black mb-6 tracking-tight">LIST IT</h1>
                
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p class="text-[9px] text-slate-400 uppercase font-black mb-1">Suggested Price</p>
                        <p id="displayPrice" class="text-2xl font-black text-slate-900">$0.00</p>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p class="text-[9px] text-slate-400 uppercase font-black mb-1">Best Platform</p>
                        <p id="bestPlatform" class="text-lg font-bold text-blue-600">eBay</p>
                    </div>
                </div>

                <div class="flex items-center justify-center gap-3 text-sm font-semibold text-slate-500">
                    <i class="fa-regular fa-clock text-blue-500"></i>
                    <span>Est. Sale Time: <span id="saleTime" class="text-slate-900">--</span></span>
                </div>
            </div>

            <div class="glass-panel rounded-3xl p-6">
                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Select Your Strategy</h4>
                <div class="flex gap-2" id="priceToggles">
                    <button onclick="updatePrice('fast')" id="btn-fast" class="price-btn flex-1 py-3 px-2 bg-white/5 rounded-xl text-[10px] font-black border border-white/10 transition-all uppercase">Fast Sale</button>
                    <button onclick="updatePrice('balanced')" id="btn-balanced" class="price-btn active flex-1 py-3 px-2 rounded-xl text-[10px] font-black border transition-all uppercase">Balanced</button>
                    <button onclick="updatePrice('max')" id="btn-max" class="price-btn flex-1 py-3 px-2 bg-white/5 rounded-xl text-[10px] font-black border border-white/10 transition-all uppercase">Max Profit</button>
                </div>
            </div>

            <div class="text-center px-4">
                <p id="tipText" class="text-blue-100 text-lg font-medium leading-relaxed mb-4 italic">"--"</p>
                <div class="flex items-center justify-center gap-2">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>
                    <p id="confidenceText" class="text-[10px] text-blue-100/40 uppercase font-black tracking-widest">Based on -- sales</p>
                </div>
            </div>

            <button id="waitlistTrigger" class="w-full py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl text-xs font-bold uppercase tracking-widest transition-all">
                Join Founders Waitlist for Amazon FBA Pro Tools
            </button>
        </div>
    </main>

    <div id="scannerModal" class="hidden fixed inset-0 bg-slate-900/95 z-[60] flex flex-col items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[2rem] w-full max-w-md relative shadow-2xl">
            <button id="closeScanner" class="absolute -top-14 right-0 text-white p-2 text-4xl">&times;</button>
            <div id="reader"></div>
            <p class="text-center mt-6 text-slate-500 font-bold text-sm">Scanning for Barcode...</p>
        </div>
    </div>

    <div id="waitlistModal" class="hidden fixed inset-0 bg-slate-900/95 z-[60] flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-lg relative shadow-2xl h-[80vh] overflow-hidden">
            <button id="closeWaitlist" class="absolute top-4 right-4 text-slate-400 text-2xl">&times;</button>
            <iframe src="https://api.leadconnectorhq.com/widget/form/KXnL4GxJTy9gJMmBVwhr" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let currentPrices = {};
        const waitlistModal = document.getElementById('waitlistModal');

        // GHL Waitlist Toggle
        document.getElementById('waitlistTrigger').onclick = () => waitlistModal.classList.remove('hidden');
        document.getElementById('closeWaitlist').onclick = () => waitlistModal.classList.add('hidden');

        function updatePrice(tier) {
            // Update the display
            document.getElementById('displayPrice').innerText = `$${currentPrices[tier].toFixed(2)}`;
            
            // Toggle active classes
            document.querySelectorAll('.price-btn').forEach(btn => btn.classList.remove('active', 'bg-blue-600', 'border-blue-400'));
            const activeBtn = document.getElementById(`btn-${tier}`);
            activeBtn.classList.add('active');
        }

        document.getElementById('searchForm').onsubmit = async (e) => {
            e.preventDefault();
            const loading = document.getElementById('loading');
            const results = document.getElementById('resultsArea');
            const btn = document.getElementById('analyzeBtn');

            btn.disabled = true;
            loading.classList.remove('hidden');
            results.classList.add('hidden');

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: document.getElementById('query').value,
                        cost_price: document.getElementById('cost_price').value,
                        shipping_cost: document.getElementById('shipping_cost').value
                    })
                });
                
                const data = await response.json();
                currentPrices = data.pricing_tiers;

                // Update UI Fields
                document.getElementById('verdictTitle').innerText = data.verdict;
                document.getElementById('bestPlatform').innerText = data.best_platform;
                document.getElementById('saleTime').innerText = data.time_to_sell;
                document.getElementById('tipText').innerText = `"${data.tip}"`;
                document.getElementById('confidenceText').innerText = data.metrics.confidence_msg;
                
                // Set Verdict Color
                document.getElementById('verdictCard').style.borderBottomColor = data.color_code;
                document.getElementById('verdictTitle').style.color = data.color_code;

                // Set Default Price
                updatePrice('balanced');

                loading.classList.add('hidden');
                results.classList.remove('hidden');
                results.scrollIntoView({ behavior: 'smooth' });

            } catch (err) { alert("Market data unavailable. Try a different search."); }
            finally { btn.disabled = false; }
        };

        // Scanner Logic
        let html5QrCode;
        document.getElementById('scanBtn').onclick = async () => {
            document.getElementById('scannerModal').classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                document.getElementById('query').value = text;
                stopScanner();
            });
        };

        async function stopScanner() {
            if (html5QrCode?.isScanning) await html5QrCode.stop();
            document.getElementById('scannerModal').classList.add('hidden');
        }
        document.getElementById('closeScanner').onclick = stopScanner;
    </script>
</body>
</html>
