<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ResellSquare | Decision Intelligence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; color: white; }
        /* Branded Gradient from previous versions */
        .app-container { background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%); min-height: 100vh; background-attachment: fixed; }
        
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .inner-subcard { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Emerald Green Branding for Actions */
        .btn-green { background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4); }
        .price-chip.active { background: #3B82F6; color: white; border-color: #60A5FA; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        /* Micro-Animations */
        .velocity-bar { transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1); }
        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tabular { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="antialiased">

    <div class="app-container pb-12">
        <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
            <div class="max-w-xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-green-500 w-8 h-8 rounded-lg flex items-center justify-center font-black text-white shadow-lg">R</div>
                    <span class="text-xl font-black tracking-tight text-white">ResellSquare</span>
                </div>
                <span class="text-[10px] font-black text-white/40 uppercase tracking-[0.3em]">Decision Engine v2.1</span>
            </div>
        </nav>

        <main class="max-w-xl mx-auto px-4 py-8">
            
            <div class="glass-card rounded-[2.5rem] p-8 mb-8 fade-up">
                <form id="searchForm" class="space-y-6">
                    <div class="relative">
                        <label class="block text-[10px] font-black text-blue-200 uppercase tracking-widest mb-3 ml-1">Product Discovery</label>
                        <input type="text" id="query" class="w-full pl-6 pr-14 py-5 bg-slate-900/60 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-blue-400 transition-all text-lg font-medium" placeholder="Product name or UPC..." required>
                        <button type="button" id="scanBtn" class="absolute right-3 top-9 p-3 text-slate-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-barcode text-2xl"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="inner-subcard rounded-2xl p-4">
                            <p class="text-[9px] font-black text-blue-200 uppercase mb-2 tracking-widest">Buy Price</p>
                            <input type="number" step="0.01" id="cost_price" class="bg-transparent w-full text-xl font-bold outline-none text-white tabular" placeholder="0.00">
                        </div>
                        <div class="inner-subcard rounded-2xl p-4">
                            <p class="text-[9px] font-black text-blue-200 uppercase mb-2 tracking-widest">Shipping</p>
                            <input type="number" step="0.01" id="shipping_cost" class="bg-transparent w-full text-xl font-bold outline-none text-white tabular" value="0.00">
                        </div>
                    </div>

                    <button type="submit" id="analyzeBtn" class="w-full py-5 btn-green text-white font-black text-lg rounded-2xl transition-all active:scale-[0.98] uppercase tracking-wider">
                        What should I do?
                    </button>
                </form>
            </div>

            <div id="resultsArea" class="hidden space-y-6 fade-up">
                
                <div class="bg-white rounded-[3rem] p-10 text-center shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2" id="verdictTopBar"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Market Consensus</p>
                    <h1 id="verdictTitle" class="text-6xl font-black text-slate-900 mb-8 tracking-tighter italic">LIST IT</h1>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-black uppercase mb-1">Target Price</p>
                            <p id="displayPrice" class="text-4xl font-black text-slate-900 tabular">$0.00</p>
                        </div>
                        <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-black uppercase mb-1">Best Platform</p>
                            <p id="bestPlatform" class="text-xl font-black text-blue-600">eBay</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card rounded-[2rem] p-6 flex flex-col justify-between">
                        <div>
                            <p class="text-[9px] font-black text-blue-200 uppercase tracking-widest mb-4">Demand Velocity</p>
                            <p id="saleTime" class="text-xl font-bold text-white mb-2">--</p>
                            <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                                <div id="velocityBar" class="velocity-bar h-full bg-blue-500" style="width: 0%"></div>
                            </div>
                        </div>
                        <p class="text-[10px] text-blue-100/40 mt-4">Est. time to sell</p>
                    </div>

                    <div class="glass-card rounded-[2rem] p-6">
                        <p class="text-[9px] font-black text-blue-200 uppercase tracking-widest mb-4">Est. Net Profit</p>
                        <p id="netProfit" class="text-3xl font-black text-green-400 mb-1 tabular">$0.00</p>
                        <p id="roiText" class="text-[10px] font-bold text-blue-100/40">0% ROI</p>
                    </div>
                </div>

                <div class="glass-card rounded-[2rem] p-6">
                    <p class="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-4">Pricing Strategy</p>
                    <div class="flex p-1 bg-slate-900/60 rounded-2xl border border-white/5">
                        <button onclick="updatePrice('fast')" id="btn-fast" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">Fast Sale</button>
                        <button onclick="updatePrice('balanced')" id="btn-balanced" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all active">Balanced</button>
                        <button onclick="updatePrice('max')" id="btn-max" class="price-chip flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">Max Profit</button>
                    </div>
                </div>

                <div class="glass-card rounded-[2rem] p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="text-[10px] font-black text-blue-200 uppercase tracking-widest">Evidence Feed</h4>
                        <span class="text-[9px] bg-white/10 px-2 py-1 rounded text-blue-100/40 font-bold uppercase">Live Comps</span>
                    </div>
                    <div id="compsList" class="space-y-3">
                        </div>
                </div>

                <div class="p-8 text-center italic text-blue-50/90 text-lg leading-relaxed font-medium">
                    <span id="tipText">--</span>
                </div>

            </div>
        </main>
    </div>

    <script>
        let currentPrices = {};
        
        function updatePrice(tier) {
            document.getElementById('displayPrice').innerText = `$${currentPrices[tier].toFixed(2)}`;
            document.querySelectorAll('.price-chip').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tier}`).classList.add('active');
        }

        document.getElementById('searchForm').onsubmit = async (e) => {
            e.preventDefault();
            const results = document.getElementById('resultsArea');
            const btn = document.getElementById('analyzeBtn');
            btn.innerText = "Analyzing Market...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: document.getElementById('query').value,
                        cost_price: document.getElementById('cost_price').value,
                        shipping_cost: document.getElementById('shipping_cost').value
                    })
                });
                
                const data = await response.json();
                currentPrices = data.pricing_tiers;

                document.getElementById('verdictTitle').innerText = data.verdict;
                document.getElementById('verdictTitle').style.color = data.color_code;
                document.getElementById('verdictTopBar').style.backgroundColor = data.color_code;
                document.getElementById('bestPlatform').innerText = data.best_platform;
                document.getElementById('saleTime').innerText = data.time_to_sell;
                document.getElementById('tipText').innerText = data.tip;
                document.getElementById('netProfit').innerText = `$${data.financials?.profit.toFixed(2) || '0.00'}`;
                document.getElementById('roiText').innerText = `${data.financials?.roi || 0}% ROI`;
                
                // Animate Velocity Bar
                const velocityMap = { "1–2 weeks": 90, "2–4 weeks": 65, "4–8 weeks": 35, "May take months": 15 };
                document.getElementById('velocityBar').style.width = (velocityMap[data.time_to_sell] || 10) + "%";

                // Evidence Rendering
                const compsList = document.getElementById('compsList');
                compsList.innerHTML = '';
                if (data.recent_sales) {
                    data.recent_sales.forEach(sale => {
                        const compItem = document.createElement('div');
                        compItem.className = "inner-subcard rounded-2xl p-4 flex items-center justify-between border border-white/5";
                        compItem.innerHTML = `
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-slate-800 rounded-xl flex items-center justify-center overflow-hidden border border-white/5">
                                    ${sale.image ? `<img src="${sale.image}" class="object-cover w-full h-full">` : '<i class="fa-solid fa-image text-slate-700"></i>'}
                                </div>
                                <div>
                                    <p class="text-[11px] font-bold text-white line-clamp-1">${sale.title}</p>
                                    <p class="text-[9px] text-slate-500 font-medium">${sale.date}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-black text-green-400 tabular">$${sale.price.toFixed(2)}</p>
                                <p class="text-[8px] font-black text-slate-500 uppercase">Verified</p>
                            </div>
                        `;
                        compsList.appendChild(compItem);
                    });
                }

                updatePrice('balanced');
                results.classList.remove('hidden');
                results.scrollIntoView({ behavior: 'smooth' });

            } catch (err) { alert("Market data unreachable."); }
            finally { btn.innerText = "What should I do?"; btn.disabled = false; }
        };
    </script>
</body>
</html>
