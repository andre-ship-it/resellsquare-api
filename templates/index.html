<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ResellSquare — Should I Buy This?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0C0E;
    --surface: #161619;
    --surface-2: #1E1E22;
    --border: #2A2A30;
    --text: #E8E8EC;
    --text-muted: #8A8A95;
    --accent: #3BF584;
    --accent-dim: rgba(59, 245, 132, 0.12);
    --danger: #FF4D6A;
    --danger-dim: rgba(255, 77, 106, 0.12);
    --warn: #FFB84D;
    --warn-dim: rgba(255, 184, 77, 0.12);
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: var(--bg);
  }

  .logo-text {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 20px 100px;
  }

  .tagline {
    text-align: center;
    padding: 28px 0 24px;
  }

  .tagline h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .tagline h1 span { color: var(--accent); }

  .tagline p {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .input-group { margin-bottom: 12px; }
  .input-group:last-child { margin-bottom: 0; }

  .input-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    display: block;
  }

  .input-field {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-field::placeholder { color: #4A4A55; font-weight: 500; }
  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .cost-input { position: relative; }

  .cost-input .dollar-sign {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
  }

  .cost-input .input-field { padding-left: 30px; }

  .condition-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .condition-btn {
    flex: 1;
    padding: 10px 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .condition-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .analyze-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 12px;
  }

  .analyze-btn:active { transform: scale(0.98); }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .analyze-btn.loading { position: relative; color: transparent; }

  .analyze-btn.loading::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border: 3px solid rgba(12,12,14,0.3);
    border-top-color: var(--bg);
    border-radius: 50%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  .verdict-card {
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    text-align: center;
    animation: slideUp 0.3s ease-out;
    display: none;
  }

  .verdict-card.visible { display: block; }
  .verdict-card.go { background: var(--accent-dim); border: 1px solid rgba(59,245,132,0.25); }
  .verdict-card.skip { background: var(--danger-dim); border: 1px solid rgba(255,77,106,0.25); }
  .verdict-card.caution { background: var(--warn-dim); border: 1px solid rgba(255,184,77,0.25); }

  .verdict-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .verdict-card.go .verdict-label { color: var(--accent); }
  .verdict-card.skip .verdict-label { color: var(--danger); }
  .verdict-card.caution .verdict-label { color: var(--warn); }

  .verdict-text {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .verdict-card.go .verdict-text { color: var(--accent); }
  .verdict-card.skip .verdict-text { color: var(--danger); }
  .verdict-card.caution .verdict-text { color: var(--warn); }

  .verdict-sub {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .verdict-sub strong { color: var(--text); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .breakdown {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: none;
  }

  .breakdown.visible { display: block; animation: slideUp 0.3s ease-out; }

  .breakdown-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
  }

  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .label { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  .breakdown-row .value { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--text); }
  .breakdown-row.highlight .label { color: var(--text); font-weight: 700; }
  .breakdown-row.highlight .value { font-weight: 700; font-size: 16px; }
  .breakdown-row.profit-positive .value { color: var(--accent); }
  .breakdown-row.profit-negative .value { color: var(--danger); }

  .market-data {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: none;
  }

  .market-data.visible { display: block; animation: slideUp 0.35s ease-out; }

  .market-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .market-header .breakdown-title { margin-bottom: 0; }

  .confidence-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .confidence-high { background: var(--accent-dim); color: var(--accent); }
  .confidence-medium { background: var(--warn-dim); color: var(--warn); }
  .confidence-low { background: var(--danger-dim); color: var(--danger); }

  .price-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .price-stat {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
  }

  .price-stat .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .price-stat .stat-value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .sales-list {
    max-height: 240px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .sale-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .sale-item:last-child { border-bottom: none; }

  .sale-title {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    line-height: 1.3;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .sale-price {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }

  .sale-condition {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .sample-note {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 8px;
  }

  .error-msg {
    text-align: center;
    padding: 20px;
    color: var(--danger);
    font-size: 14px;
    font-weight: 600;
    display: none;
  }

  .error-msg.visible { display: block; }

  .footer {
    text-align: center;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  .footer p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #3A3A42;
  }

  .sales-list::-webkit-scrollbar { width: 4px; }
  .sales-list::-webkit-scrollbar-track { background: transparent; }
  .sales-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (min-width: 600px) {
    .container { padding: 24px 32px 100px; }
    .tagline h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">R</div>
      <span class="logo-text">ResellSquare</span>
    </div>
    <span class="badge">Beta</span>
  </div>

  <div class="tagline">
    <h1>Should I <span>buy</span> this?</h1>
    <p>Instant profit check using real eBay sold data.</p>
  </div>

  <div class="search-section">
    <div class="input-group">
      <label class="input-label">Product</label>
      <input id="productInput" type="text" class="input-field" placeholder="e.g. AirPods Pro 2nd Gen" autocomplete="off" enterkeyhint="next">
    </div>
    <div class="input-row">
      <div class="input-group">
        <label class="input-label">Your cost</label>
        <div class="cost-input">
          <span class="dollar-sign">$</span>
          <input id="costInput" type="number" class="input-field" placeholder="0.00" inputmode="decimal" step="0.01" min="0" enterkeyhint="go">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Shipping cost</label>
        <div class="cost-input">
          <span class="dollar-sign">$</span>
          <input id="shippingInput" type="number" class="input-field" placeholder="0.00" inputmode="decimal" step="0.01" min="0" value="0" enterkeyhint="go">
        </div>
      </div>
    </div>
    <div class="condition-row">
      <button class="condition-btn active" data-condition="all" onclick="setCondition(this)">All</button>
      <button class="condition-btn" data-condition="new" onclick="setCondition(this)">New</button>
      <button class="condition-btn" data-condition="used" onclick="setCondition(this)">Used</button>
    </div>
  </div>

  <button id="analyzeBtn" class="analyze-btn" onclick="analyze()">Analyze Profit</button>

  <div id="error" class="error-msg"></div>
  <div id="verdict" class="verdict-card"></div>

  <div id="breakdown" class="breakdown">
    <div class="breakdown-title">Profit Breakdown</div>
    <div id="breakdownRows"></div>
  </div>

  <div id="marketData" class="market-data">
    <div class="market-header">
      <div class="breakdown-title">Market Data</div>
      <span id="confidenceBadge" class="confidence-badge"></span>
    </div>
    <div class="price-grid">
      <div class="price-stat">
        <div class="stat-label">Avg</div>
        <div id="avgPrice" class="stat-value">&mdash;</div>
      </div>
      <div class="price-stat">
        <div class="stat-label">Median</div>
        <div id="medianPrice" class="stat-value">&mdash;</div>
      </div>
      <div class="price-stat">
        <div class="stat-label">Range</div>
        <div id="priceRange" class="stat-value">&mdash;</div>
      </div>
    </div>
    <div class="breakdown-title">Recent Sales</div>
    <div id="salesList" class="sales-list"></div>
    <div id="sampleNote" class="sample-note"></div>
  </div>

  <div class="footer">
    <p>eBay fees estimated at 13.25% &middot; final value + payment processing</p>
  </div>
</div>

<script>
const EBAY_FEE_RATE = 0.1325;
let selectedCondition = 'all';

function setCondition(btn) {
  document.querySelectorAll('.condition-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedCondition = btn.dataset.condition;
}

document.getElementById('productInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('costInput').focus();
});
document.getElementById('costInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') analyze();
});
document.getElementById('shippingInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') analyze();
});

async function analyze() {
  const product = document.getElementById('productInput').value.trim();
  const cost = parseFloat(document.getElementById('costInput').value) || 0;
  const shipping = parseFloat(document.getElementById('shippingInput').value) || 0;
  const btn = document.getElementById('analyzeBtn');

  hideResults();

  if (!product) { showError('Enter a product name to search.'); return; }
  if (cost <= 0) { showError('Enter your cost so we can calculate profit.'); return; }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const response = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ search_term: product, condition: selectedCondition })
    });

    const data = await response.json();

    if (!data.success) {
      showError(data.error || 'No results found. Try a different search.');
      return;
    }

    const sellPrice = data.median_price;
    const ebayFees = round(sellPrice * EBAY_FEE_RATE);
    const totalCost = cost + shipping;
    const netProfit = round(sellPrice - ebayFees - totalCost);
    const profitMargin = round((netProfit / sellPrice) * 100);
    const roi = round((netProfit / totalCost) * 100);

    renderVerdict(netProfit, profitMargin, roi, sellPrice);
    renderBreakdown(sellPrice, ebayFees, cost, shipping, totalCost, netProfit, profitMargin, roi);
    renderMarketData(data);

  } catch (err) {
    showError('Something went wrong. Try again.');
    console.error(err);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function renderVerdict(profit, margin, roi) {
  const el = document.getElementById('verdict');
  let type, text, sub;

  if (margin >= 20) {
    type = 'go';
    text = 'BUY IT';
    sub = '<strong>$' + profit.toFixed(2) + '</strong> profit per unit &middot; ' + roi + '% ROI';
  } else if (margin >= 5) {
    type = 'caution';
    text = 'THIN MARGIN';
    sub = '<strong>$' + profit.toFixed(2) + '</strong> profit &middot; Only ' + margin + '% margin';
  } else {
    type = 'skip';
    text = profit <= 0 ? 'SKIP IT' : 'NOT WORTH IT';
    sub = profit <= 0
      ? 'You\'d <strong>lose $' + Math.abs(profit).toFixed(2) + '</strong> per unit'
      : 'Only <strong>$' + profit.toFixed(2) + '</strong> profit &middot; ' + margin + '% margin';
  }

  el.className = 'verdict-card visible ' + type;
  el.innerHTML = '<div class="verdict-label">Verdict</div><div class="verdict-text">' + text + '</div><div class="verdict-sub">' + sub + '</div>';
}

function renderBreakdown(sell, fees, cost, shipping, totalCost, profit, margin, roi) {
  const rows = document.getElementById('breakdownRows');
  const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';

  let html = '';
  html += '<div class="breakdown-row"><span class="label">Expected sale price (median)</span><span class="value">$' + sell.toFixed(2) + '</span></div>';
  html += '<div class="breakdown-row"><span class="label">eBay fees (13.25%)</span><span class="value">-$' + fees.toFixed(2) + '</span></div>';
  html += '<div class="breakdown-row"><span class="label">Your cost</span><span class="value">-$' + cost.toFixed(2) + '</span></div>';
  if (shipping > 0) {
    html += '<div class="breakdown-row"><span class="label">Shipping cost</span><span class="value">-$' + shipping.toFixed(2) + '</span></div>';
  }
  html += '<div class="breakdown-row highlight ' + profitClass + '"><span class="label">Net Profit</span><span class="value">' + (profit >= 0 ? '' : '-') + '$' + Math.abs(profit).toFixed(2) + '</span></div>';
  html += '<div class="breakdown-row"><span class="label">Profit margin</span><span class="value">' + margin + '%</span></div>';
  html += '<div class="breakdown-row"><span class="label">Return on investment</span><span class="value">' + roi + '%</span></div>';

  rows.innerHTML = html;
  document.getElementById('breakdown').classList.add('visible');
}

function renderMarketData(data) {
  document.getElementById('avgPrice').textContent = '$' + data.avg_price.toFixed(0);
  document.getElementById('medianPrice').textContent = '$' + data.median_price.toFixed(0);
  document.getElementById('priceRange').textContent = '$' + data.min_price.toFixed(0) + '-' + data.max_price.toFixed(0);

  const badge = document.getElementById('confidenceBadge');
  const count = data.count;
  let conf, cls;
  if (count >= 20) { conf = 'High'; cls = 'confidence-high'; }
  else if (count >= 10) { conf = 'Medium'; cls = 'confidence-medium'; }
  else { conf = 'Low'; cls = 'confidence-low'; }
  badge.textContent = conf + ' confidence';
  badge.className = 'confidence-badge ' + cls;

  const list = document.getElementById('salesList');
  const sales = data.recent_sales || [];
  list.innerHTML = sales.slice(0, 15).map(function(sale) {
    return '<div class="sale-item"><div><div class="sale-title">' + escapeHtml(sale.title) + '</div>' +
      (sale.condition ? '<div class="sale-condition">' + escapeHtml(sale.condition) + '</div>' : '') +
      '</div><div class="sale-price">$' + sale.price.toFixed(2) + '</div></div>';
  }).join('');

  document.getElementById('sampleNote').textContent = 'Based on ' + count + ' sold listing' + (count !== 1 ? 's' : '');
  document.getElementById('marketData').classList.add('visible');
}

function hideResults() {
  document.getElementById('verdict').className = 'verdict-card';
  document.getElementById('breakdown').className = 'breakdown';
  document.getElementById('marketData').className = 'market-data';
  document.getElementById('error').className = 'error-msg';
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('visible');
}

function round(n) { return Math.round(n * 100) / 100; }

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
